spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/collabnex?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
        jdbc.time_zone: UTC

  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:10MB}
      max-request-size: ${MAX_REQUEST_SIZE:20MB}

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:change-this-in-production-use-256-bit-key-that-is-at-least-256-bits-long-for-hs256}
    expiration-ms: ${JWT_EXPIRATION_MS:604800000}
  admin:
    email: ${ADMIN_EMAIL:admin@collabnex.com}
    password: ${ADMIN_PASSWORD:changeme}
  storage:
    upload-dir: ${UPLOAD_DIR:uploads}
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
